<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Compressor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-surface: rgba(24, 24, 27, 0.75);
      --bg-surface-hover: rgba(39, 39, 42, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #d4d4d8;
      --accent: #f4f4f5;
      --accent-hover: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.12);
      --success: #e4e4e7;
      --success-glow: rgba(255, 255, 255, 0.1);
      --danger: #ef4444;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-subtle: #71717a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.06), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3f3f46, #18181b);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #f4f4f5;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-quit {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-quit:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 44px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.015);
      position: relative;
    }

    .dropzone.dragover {
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.04);
      transform: scale(1.01);
    }

    .dropzone-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .dropzone-text {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .dropzone-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    #file-input {
      display: none;
    }

    /* Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      margin-top: 24px;
      align-items: center;
    }

    .preset-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .preset-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .preset-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-chip {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-chip:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .preset-chip.active {
      background: #f4f4f5;
      color: #18181b;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
    }

    .btn-action {
      background: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #18181b;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-action:hover:not(:disabled) {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.18);
    }

    .btn-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* Selected File Badge */
    .selected-files {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
    }

    .file-badge-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }

    .file-badge-size {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Progress & Results */
    .results-card {
      display: none;
    }

    .results-card.visible {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .result-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-filename {
      font-weight: 600;
      font-size: 15px;
    }

    .result-meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge-saving {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f4f4f5;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
          </svg>
        </div>
        <div>
          <h1>Mini PDF Compressor</h1>
          <div class="subtitle">golang + Ghostscript 초경량 단일 바이너리</div>
        </div>
      </div>
      <button class="btn-quit" id="btn-shutdown" title="서버 종료">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" />
        </svg>
        종료
      </button>
    </header>

    <main class="card">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
          </svg>
        </div>
        <div class="dropzone-text">PDF 파일을 드래그하거나 클릭하여 선택</div>
        <div class="dropzone-hint">여러 파일도 일괄 선택 가능</div>
        <input type="file" id="file-input" accept="application/pdf" multiple>
      </div>

      <div class="selected-files" id="selected-files"></div>

      <div class="controls-grid">
        <div class="preset-selector">
          <span class="preset-label">압축 강도</span>
          <div class="preset-options">
            <button type="button" class="preset-chip active" data-preset="screen">최대 압축 (Screen)</button>
            <button type="button" class="preset-chip" data-preset="ebook">균형 (eBook)</button>
            <button type="button" class="preset-chip" data-preset="printer">인쇄용 (Printer)</button>
            <button type="button" class="preset-chip" data-preset="prepress">원본 보존 (Prepress)</button>
          </div>
        </div>
        <button class="btn-action" id="btn-compress" disabled>
          <span>압축 시작</span>
        </button>
      </div>
    </main>

    <section class="card results-card" id="results-card">
      <h2 style="font-size: 16px; margin-bottom: 4px;">압축 완료 목록</h2>
      <div id="results-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </section>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const selectedFilesEl = document.getElementById('selected-files');
    const btnCompress = document.getElementById('btn-compress');
    const resultsCard = document.getElementById('results-card');
    const resultsList = document.getElementById('results-list');
    const btnShutdown = document.getElementById('btn-shutdown');
    const presetChips = document.querySelectorAll('.preset-chip');

    let currentFiles = [];
    let selectedPreset = 'screen';

    presetChips.forEach(chip => {
      chip.addEventListener('click', () => {
        presetChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedPreset = chip.dataset.preset;
      });
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFiles(Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.pdf')));
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(Array.from(e.target.files));
    });

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function handleFiles(files) {
      currentFiles = files;
      selectedFilesEl.innerHTML = '';
      if (files.length === 0) {
        btnCompress.disabled = true;
        return;
      }
      btnCompress.disabled = false;
      files.forEach(file => {
        const item = document.createElement('div');
        item.className = 'file-badge';
        item.innerHTML = `
          <span class="file-badge-name">${file.name}</span>
          <span class="file-badge-size">${formatBytes(file.size)}</span>
        `;
        selectedFilesEl.appendChild(item);
      });
    }

    btnCompress.addEventListener('click', async () => {
      if (currentFiles.length === 0) return;
      btnCompress.disabled = true;
      btnCompress.innerHTML = '<div class="spinner"></div><span>압축 진행 중...</span>';
      resultsList.innerHTML = '';
      resultsCard.classList.add('visible');

      for (const file of currentFiles) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('preset', selectedPreset);

        try {
          const res = await fetch('/api/compress', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.success) {
            renderResultItem(data);
          } else {
            renderErrorItem(file.name, data.error || '압축 실패');
          }
        } catch (err) {
          renderErrorItem(file.name, err.message);
        }
      }

      btnCompress.disabled = false;
      btnCompress.innerHTML = '<span>압축 시작</span>';
    });

    function renderResultItem(data) {
      const row = document.createElement('div');
      row.className = 'result-row';
      const badgeHTML = data.isFallback
        ? `<span class="badge-saving" style="background: rgba(255, 255, 255, 0.08); color: var(--text-muted); border-color: rgba(255, 255, 255, 0.15);">원본 보존 (0%)</span>`
        : `<span class="badge-saving">-${data.ratio.toFixed(1)}% 절감</span>`;

      row.innerHTML = `
        <div class="result-info">
          <div class="result-filename">${data.filename}</div>
          <div class="result-meta">
            <span>원본: ${formatBytes(data.originalSize)}</span>
            <span>결과: ${formatBytes(data.compressedSize)}</span>
            ${badgeHTML}
          </div>
        </div>
        <a class="btn-download" href="/api/download/${data.id}" download="${data.filename}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          다운로드
        </a>
      `;
      resultsList.appendChild(row);
    }

    function renderErrorItem(filename, errorMsg) {
      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <div class="result-info">
          <div class="result-filename">${filename}</div>
          <div class="result-meta" style="color: var(--danger);">오류: ${errorMsg}</div>
        </div>
      `;
      resultsList.appendChild(row);
    }

    btnShutdown.addEventListener('click', async () => {
      if (confirm('서버를 종료하시겠습니까?')) {
        try {
          await fetch('/api/shutdown', { method: 'POST' });
        } catch (_) { }
        document.body.innerHTML = `
          <div style="text-align: center; margin-top: 100px; color: #94a3b8;">
            <h2 style="color: #f8fafc; margin-bottom: 8px;">서버가 종료되었습니다.</h2>
            <p>브라우저 탭을 닫아주세요.</p>
          </div>
        `;
      }
    });
  </script>
</body>

</html>
